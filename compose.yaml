x-app-environment: &app-environment
  SECRET_KEY: ${SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  IDEMPOTENCY_RETENTION_HOURS: ${IDEMPOTENCY_RETENTION_HOURS:-24}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@dice-tournament.local}
  DJANGO_SETTINGS_MODULE: config.settings.development

x-app-base: &app-base
  build:
    context: .
    target: production
  environment: *app-environment
  restart: unless-stopped

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    <<: *app-base
    restart: "no"
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "1"
    command: ["true"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  seed-demo:
    <<: *app-base
    build:
      context: .
      target: development
    restart: "no"
    environment:
      <<: *app-environment
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    command: ["true"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles:
      - tools

  web:
    <<: *app-base
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  celery-notifications:
    <<: *app-base
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "-Q",
        "notifications",
        "--concurrency=2",
        "-n",
        "notifications@%h",
        "--loglevel=INFO",
      ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping -d notifications@$${HOSTNAME} --timeout=5 | grep -q pong",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s

  celery-maintenance:
    <<: *app-base
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "-Q",
        "maintenance",
        "--concurrency=2",
        "-n",
        "maintenance@%h",
        "--loglevel=INFO",
      ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping -d maintenance@$${HOSTNAME} --timeout=5 | grep -q pong",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s

  celery-beat:
    <<: *app-base
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "--loglevel=INFO",
        "--pidfile=/tmp/celerybeat.pid",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
