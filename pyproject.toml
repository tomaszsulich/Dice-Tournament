[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "api", "common", "config", "tournaments"]

[tool.ruff.lint.per-file-ignores]
"src/config/settings/*.py" = ["F403"]
"**/migrations/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
