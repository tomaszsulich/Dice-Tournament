name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  checks:
    name: Tests and code quality
    runs-on: ubuntu-latest
    container:
      image: python:3.12-bookworm

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dice_tournament
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d dice_tournament"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dice_tournament
      POSTGRES_SERVICE_HOST: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Run Ruff checks
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Check Django configuration
        run: python src/manage.py check

      - name: Check for missing migrations
        run: python src/manage.py makemigrations --check --dry-run

      - name: Apply database migrations
        run: python src/manage.py migrate --noinput

      - name: Run full test suite with coverage
        run: python -m coverage run -m pytest

      - name: Report coverage
        run: python -m coverage report
