[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
pythonpath = src
addopts = --strict-markers
markers =
    unit: tests isolated from infrastructure and external services
    integration: tests covering integration between application components
    postgres: tests requiring PostgreSQL
    concurrency: tests covering concurrent behavior
    websocket: tests covering WebSocket behavior
    slow: tests intentionally excluded from the fast pre-commit unit subset
