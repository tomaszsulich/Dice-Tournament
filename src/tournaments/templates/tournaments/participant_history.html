{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My roll history — Dice Tournament</title>
    <link rel="stylesheet" href="{% static 'tournaments/css/organizer_dashboard.css' %}">
</head>

<body>
    <main class="dashboard comparison" data-participant-id="{{ history_options.participant.id }}">
        <header class="dashboard__heading">
            <div>
                <p class="eyebrow">Completed&nbsp;tournaments</p>
                <h1>My&nbsp;roll&nbsp;history</h1>
                <p>Review your saved rolls, holds, category decisions and results.</p>
            </div>
        </header>

        <section id="own-history-grid" class="comparison-grid" aria-label="Completed tournament histories"></section>

        <dialog id="history-modal" class="history-modal" aria-labelledby="history-title">
            <div class="history-modal__heading">
                <h2 id="history-title">Roll&nbsp;history</h2>
                <button id="history-close" type="button" aria-label="Close history">×</button>
            </div>

            <div class="history-modal__filters">
                <label for="history-round">Round</label>
                <select id="history-round">
                    <option value="">All rounds</option>
                </select>
            </div>

            <div id="history-content"></div>
            <button id="history-more" type="button" hidden>Load&nbsp;more</button>
        </dialog>
    </main>

    {{ history_options.tournaments|json_script:"own-history-data" }}
    <script type="module" src="{% static 'tournaments/js/participant_comparison.js' %}"></script>
</body>
</html>
