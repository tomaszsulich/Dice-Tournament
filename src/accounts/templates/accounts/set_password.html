{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set new password · Dice Tournament</title>
  <link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">
</head>

<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="page-title">
      <header class="auth-heading">
        <div class="brand-mark" aria-hidden="true">⚄</div>
        <div>
          <p class="eyebrow">Dice Tournament</p>
          <h1 id="page-title">Choose a new password</h1>
        </div>
      </header>
      <p class="intro">Use the one-time link from&nbsp;your email.</p>

      <form id="set-password-form" class="auth-form" novalidate>
        <label>New&nbsp;password<input name="new_password" type="password" autocomplete="new-password" required></label>
        <label>Repeat new&nbsp;password<input name="repeat_password" type="password" autocomplete="new-password" required></label>
        <p id="form-error" class="form-message error" role="alert" hidden></p>
        <p id="form-success" class="form-message success" role="status" hidden></p>
        <button class="primary-action" type="submit">Set new&nbsp;password</button>
      </form>

      <p class="switch-link"><a href="{% url 'login' %}">Back to&nbsp;sign in</a></p>
    </section>
  </main>
  <script src="{% static 'accounts/js/auth.js' %}" defer></script>
  <script src="{% static 'accounts/js/set_password.js' %}" defer></script>
</body>

</html>
