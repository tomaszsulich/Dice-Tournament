{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · Dice Tournament</title>
  <link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">
</head>

<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="page-title">
      <header class="auth-heading">
        <div class="brand-mark" aria-hidden="true">⚄</div>
        <div>
          <p class="eyebrow">Dice Tournament</p>
          <h1 id="page-title">Reset your password</h1>
        </div>
      </header>
      <p class="intro">Enter your email. If it matches an&nbsp;account, we will send a&nbsp;one-time reset link.</p>

      <form id="password-reset-form" class="auth-form" novalidate>
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <p id="form-error" class="form-message error" role="alert" hidden></p>
        <p id="form-success" class="form-message success" role="status" hidden></p>
        <button class="primary-action" type="submit">Send reset&nbsp;link</button>
      </form>

      <p class="switch-link"><a href="{% url 'login' %}">Back to sign in</a></p>
    </section>
  </main>
  <script src="{% static 'accounts/js/auth.js' %}" defer></script>
  <script src="{% static 'accounts/js/password_reset.js' %}" defer></script>
</body>

</html>
